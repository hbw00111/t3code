name: Fork Desktop Release

on:
  push:
    branches:
      - main
      - feat/codex-goal-command
    paths:
      - apps/desktop/package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-desktop-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish macOS arm64
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether release exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Vite+
        if: steps.existing.outputs.exists != 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        if: steps.existing.outputs.exists != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build desktop update
        if: steps.existing.outputs.exists != 'true'
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          node scripts/build-desktop-artifact.ts \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "${{ steps.version.outputs.version }}"

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: T3 Code ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*-mac.yml
